<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kapowarr API</title>
	<link rel="icon" href="{{ url_base }}/static/img/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css" integrity="sha384-+R8fx41ke61Yq4+j30C8Uh8fbNUEGy8Le9lzVmeMfiUNd+H3q8gN7qW9LM3rbesj" crossorigin="anonymous">
</head>
<body>
	<div id="swagger-ui"></div>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js" integrity="sha384-5zikP7B6JemcHcJalIiFMnUirmSVBr3lZ85ClVPXO7mamWuqUixgyCMUPcKKfZLk" crossorigin="anonymous"></script>
	<script>
		const ui = SwaggerUIBundle({
			url: "{{ url_base }}/static/openapi.yaml",
			dom_id: "#swagger-ui",
			deepLinking: true,
			persistAuthorization: true,
			onComplete: () => {
				// Reuse the key of a logged-in Kapowarr session, if any
				try {
					const storage = JSON.parse(localStorage.getItem("kapowarr"));
					if (storage && storage.api_key)
						ui.preauthorizeApiKey("ApiKey", storage.api_key);
				} catch (e) {}
			}
		});
	</script>
</body>
</html>
